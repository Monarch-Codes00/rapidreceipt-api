spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rapidreceipt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:devsecretkey_change_this_in_production_must_be_at_least_256bits}
    expiration: 2592000000
