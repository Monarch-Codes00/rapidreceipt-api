spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rapidreceipt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:christopher}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:rapidreceipt-dev-secret-key-change-this-in-production-min-256bits}
    expiration: 3600000 # 1 hour in milliseconds

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:sk_test_placeholder_replace_me}
